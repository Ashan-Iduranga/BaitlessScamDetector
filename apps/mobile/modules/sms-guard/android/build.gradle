plugins {
  id 'com.android.library'
  id 'expo-module-gradle-plugin'
}

group = 'com.baitless'
version = '1.0.0'

android {
  namespace "expo.modules.smsguard"
  defaultConfig {
    versionCode 1
    versionName '1.0.0'
  }
}

dependencies {
  implementation 'com.facebook.react:react-android'
  implementation "androidx.core:core-ktx:1.17.0"
}
